services:

  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    container_name: proxy
    restart: unless-stopped

    depends_on:
      - app

    ports:
      - "80:80"

    networks:
      - frontend


  app:
    build:
      context: ./app
      dockerfile: Dockerfile

    container_name: app

    depends_on:
      - db

    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: app_db
      DB_USER: app_user
      DB_PASSWORD_FILE: /run/secrets/db_password

    expose:
      - "8000"

    secrets:
      - db_password

    networks:
      - frontend
      - backend


  db:
    image: mysql:8.4
    container_name: db
    restart: unless-stopped

    volumes:
      - db_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro

    environment:
      MYSQL_DATABASE: app_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password

    secrets:
      - db_password
      - db_root_password

    networks:
      - backend


volumes:
  db_data:


secrets:
  db_password:
    file: ./secrets/db_password.txt

  db_root_password:
    file: ./secrets/db_root_password.txt
# NOTE: these point at the real, gitignored files (created from the
# .example.txt templates in secrets/ — see secrets/README.md). They are not
# present in this repo snapshot; copy the examples locally before `up`.


networks:
  frontend:
    driver: bridge

  backend:
    driver: bridge