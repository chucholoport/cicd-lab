upstream python_app {
    server app:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Main application route
    location / {
        proxy_pass http://python_app;

        proxy_http_version 1.1;

        # Required for the upstream keepalive pool above to actually be
        # reused — without clearing Connection, Nginx defaults to sending
        # "Connection: close" to the upstream on every request.
        proxy_set_header Connection "";

        # Preserve client info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Don't let Nginx rewrite Location/Refresh headers from the backend
        proxy_redirect off;

        # Avoid buffering issues for APIs
        proxy_buffering off;
    }

    # Health check (direct to app)
    location /health {
        proxy_pass http://python_app/health;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # Basic timeout tuning (optional but recommended)
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}